<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Daily Tasks & Study Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --ink: #14131f;
    --surface: #1d1b2e;
    --surface-2: #262440;
    --line: #38355a;
    --paper: #f0ece3;
    --paper-dim: #a9a4c2;
    --amber: #e0a53c;
    --amber-dim: #6b5530;
    --teal: #5fb3a3;
    --teal-dim: #2c4a45;
    --danger: #d9705f;
  }

  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  .wrap{ max-width: 480px; margin: 0 auto; }

  header{ margin-bottom: 28px; }
  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 6px;
  }
  h1{
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .date{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--paper-dim);
  }

  /* --- Sundial timer --- */
  .dial-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
  }
  .dial{ position: relative; width: 108px; height: 108px; flex-shrink: 0; }
  .dial svg{ transform: rotate(-90deg); }
  .dial-track{ fill: none; stroke: var(--surface-2); stroke-width: 8; }
  .dial-progress{ fill: none; stroke: var(--amber); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.4s ease; }
  .dial-center{
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .dial-hours{ font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 600; }
  .dial-goal{ font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--paper-dim); margin-top: 2px; }

  .timer-controls{ flex: 1; }
  .timer-status{ font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--paper-dim); margin-bottom: 10px; min-height: 16px; }
  .timer-status.running{ color: var(--amber); }
  .btn-row{ display: flex; gap: 8px; }
  button{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  button:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--amber); color: #241a06; }
  .btn-stop{ background: var(--danger); color: #2a0c07; }
  .btn-ghost{ background: var(--surface-2); color: var(--paper); border: 1px solid var(--line); }
  button:disabled{ opacity: 0.4; cursor: not-allowed; }

  .goal-edit{ margin-top: 10px; display: flex; align-items: center; gap: 6px; }
  .goal-edit label{ font-size: 11.5px; color: var(--paper-dim); }
  .goal-edit input{
    width: 46px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--paper);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 3px 6px;
  }

  /* --- Sections --- */
  .section{ margin-bottom: 20px; }
  .section-title{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--paper-dim);
    margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }

  .task-list{ display: flex; flex-direction: column; gap: 8px; }
  .task{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .task.done{ opacity: 0.5; }
  .check{
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 1.5px solid var(--teal);
    flex-shrink: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
  }
  .check.checked{ background: var(--teal); }
  .check svg{ width: 12px; height: 12px; opacity: 0; }
  .check.checked svg{ opacity: 1; }
  .task-text{ flex: 1; font-size: 14.5px; line-height: 1.3; }
  .task.done .task-text{ text-decoration: line-through; }
  .task-del{
    background: none; border: none; color: var(--paper-dim);
    font-size: 16px; cursor: pointer; padding: 2px 6px;
  }
  .task-del:hover{ color: var(--danger); }

  .add-row{ display: flex; gap: 8px; margin-top: 10px; }
  .add-row input{
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .add-row input::placeholder{ color: var(--paper-dim); }

  .empty{
    text-align: center;
    color: var(--paper-dim);
    font-size: 13px;
    padding: 20px 0;
    font-family: 'JetBrains Mono', monospace;
  }

  .history{ display: flex; flex-direction: column; gap: 6px; }
  .history-row{
    display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .history-row .h-date{ color: var(--paper-dim); }
  .history-row .h-hrs{ color: var(--teal); font-weight: 600; }

  .loading{ text-align: center; padding: 40px 0; color: var(--paper-dim); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">loading ledger…</div>
</div>
