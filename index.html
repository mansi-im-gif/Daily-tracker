<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14131f">
  <meta name="description" content="A private, browser-based daily task and study tracker.">
  <title>Ledger — Daily Tasks & Study Log</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #14131f;
      --surface: #1d1b2e;
      --surface-2: #262440;
      --line: #38355a;
      --paper: #f0ece3;
      --paper-dim: #a9a4c2;
      --amber: #e0a53c;
      --teal: #5fb3a3;
      --danger: #d9705f;
      --focus: #91d5c8;
    }

    * { box-sizing: border-box; }
    html { background: var(--ink); }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--ink);
      color: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    button, input { font: inherit; }
    button, input { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 75%, transparent);
      outline-offset: 2px;
    }

    .wrap { max-width: 520px; margin: 0 auto; }
    header { margin-bottom: 28px; }
    .eyebrow {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 6px;
    }
    h1 {
      font-family: Georgia, Cambria, "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(28px, 7vw, 36px);
      margin: 0 0 4px;
      letter-spacing: -0.02em;
    }
    .date {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      color: var(--paper-dim);
    }

    .dial-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
    }
    .dial { position: relative; width: 108px; height: 108px; flex-shrink: 0; }
    .dial svg { transform: rotate(-90deg); width: 108px; height: 108px; }
    .dial-track { fill: none; stroke: var(--surface-2); stroke-width: 8; }
    .dial-progress {
      fill: none;
      stroke: var(--amber);
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.35s ease;
    }
    .dial-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .dial-hours {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 18px;
      font-weight: 700;
    }
    .dial-goal {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      color: var(--paper-dim);
      margin-top: 2px;
    }

    .timer-controls { flex: 1; min-width: 0; }
    .timer-status {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--paper-dim);
      margin-bottom: 10px;
      min-height: 17px;
    }
    .timer-status.running { color: var(--amber); }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      font-weight: 650;
      font-size: 13.5px;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }
    button:hover { filter: brightness(1.06); }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.42; cursor: not-allowed; filter: none; }
    .btn-primary { background: var(--amber); color: #241a06; }
    .btn-stop { background: var(--danger); color: #2a0c07; }
    .btn-ghost { background: var(--surface-2); color: var(--paper); border: 1px solid var(--line); }

    .goal-edit { margin-top: 10px; display: flex; align-items: center; gap: 6px; }
    .goal-edit label { font-size: 11.5px; color: var(--paper-dim); }
    .goal-edit input {
      width: 62px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--paper);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      padding: 5px 7px;
    }

    .section { margin-bottom: 22px; }
    .section-title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--paper-dim);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .task-list { display: flex; flex-direction: column; gap: 8px; }
    .task {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .task.done { opacity: 0.58; }
    .check {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 6px;
      border: 1.5px solid var(--teal);
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #10241f;
    }
    .check.checked { background: var(--teal); }
    .check svg { width: 13px; height: 13px; opacity: 0; }
    .check.checked svg { opacity: 1; }
    .task-text { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
    .task.done .task-text { text-decoration: line-through; }
    .task-del {
      background: none;
      border: none;
      color: var(--paper-dim);
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
    }
    .task-del:hover { color: var(--danger); }
    .add-row { display: flex; gap: 8px; margin-top: 10px; }
    .add-row input {
      flex: 1;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--paper);
      font-size: 14px;
    }
    .add-row input::placeholder { color: var(--paper-dim); }

    .empty {
      text-align: center;
      color: var(--paper-dim);
      font-size: 13px;
      padding: 20px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .history { display: flex; flex-direction: column; gap: 6px; }
    .history-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      padding: 9px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .history-row .h-date { color: var(--paper-dim); }
    .history-row .h-hrs { color: var(--teal); font-weight: 700; white-space: nowrap; }
    .loading, .fatal {
      text-align: center;
      padding: 40px 18px;
      color: var(--paper-dim);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .fatal strong { display: block; color: var(--danger); margin-bottom: 8px; }
    .privacy-note {
      margin-top: 18px;
      color: var(--paper-dim);
      font-size: 11.5px;
      line-height: 1.5;
      text-align: center;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 430px) {
      body { padding-top: 18px; }
      .dial-card { align-items: flex-start; padding: 18px; gap: 15px; }
      .dial, .dial svg { width: 96px; height: 96px; }
      .add-row { align-items: stretch; }
      .add-row button { padding-inline: 13px; }
    }

    @media (max-width: 350px) {
      .dial-card { flex-direction: column; align-items: center; text-align: center; }
      .timer-controls { width: 100%; }
      .btn-row, .goal-edit { justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap" id="app" aria-live="polite">
    <div class="loading">loading ledger…</div>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "ledger.daily-tracker.v2";
      const DEFAULT_GOAL_HOURS = 4;
      const MAX_HISTORY_ROWS = 14;
      const CIRCLE_RADIUS = 44;
      const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * CIRCLE_RADIUS;
      const app = document.getElementById("app");
      const storage = createStorage();
      let tickHandle = null;
      let renderedDayKey = null;
      let state = loadState();

      function createStorage() {
        try {
          const probe = `${STORAGE_KEY}.probe`;
          localStorage.setItem(probe, "1");
          localStorage.removeItem(probe);
          return localStorage;
        } catch (error) {
          console.warn("Persistent local storage is unavailable; using temporary in-memory storage.", error);
          const memory = window.__ledgerMemoryStorage instanceof Map
            ? window.__ledgerMemoryStorage
            : new Map();
          window.__ledgerMemoryStorage = memory;
          return {
            getItem: key => memory.has(String(key)) ? memory.get(String(key)) : null,
            setItem: (key, value) => memory.set(String(key), String(value)),
            removeItem: key => memory.delete(String(key))
          };
        }
      }

      function dateKeyFromDate(date) {
        return [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0")
        ].join("-");
      }

      function todayKey() {
        return dateKeyFromDate(new Date());
      }

      function startOfNextDay(timestamp) {
        const date = new Date(timestamp);
        return new Date(date.getFullYear(), date.getMonth(), date.getDate() + 1).getTime();
      }

      function formatDate(key, options = { weekday: "long", month: "long", day: "numeric" }) {
        const [year, month, day] = key.split("-").map(Number);
        return new Date(year, month - 1, day).toLocaleDateString(undefined, options);
      }

      function formatDuration(seconds, includeSeconds = false) {
        const safeSeconds = Math.max(0, Math.floor(Number(seconds) || 0));
        const hours = Math.floor(safeSeconds / 3600);
        const minutes = Math.floor((safeSeconds % 3600) / 60);
        const secs = safeSeconds % 60;

        if (includeSeconds) {
          return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
        }
        if (hours > 0) return `${hours}h ${minutes}m`;
        return `${minutes}m`;
      }

      function createEmptyState() {
        return {
          version: 2,
          goalHours: DEFAULT_GOAL_HOURS,
          days: {},
          timer: { running: false, startedAt: null }
        };
      }

      function normalizeState(candidate) {
        const clean = createEmptyState();
        if (!candidate || typeof candidate !== "object") return clean;

        const goal = Number(candidate.goalHours);
        if (Number.isFinite(goal) && goal >= 0.25 && goal <= 24) clean.goalHours = goal;

        if (candidate.days && typeof candidate.days === "object") {
          for (const [key, value] of Object.entries(candidate.days)) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(key) || !value || typeof value !== "object") continue;
            const studiedSeconds = Math.max(0, Math.floor(Number(value.studiedSeconds) || 0));
            const tasks = Array.isArray(value.tasks)
              ? value.tasks
                  .filter(task => task && typeof task.text === "string")
                  .map(task => ({
                    id: String(task.id || makeId()),
                    text: task.text.trim().slice(0, 240),
                    done: Boolean(task.done),
                    createdAt: Number(task.createdAt) || Date.now()
                  }))
                  .filter(task => task.text)
              : [];
            clean.days[key] = { studiedSeconds, tasks };
          }
        }

        if (candidate.timer && candidate.timer.running && Number.isFinite(Number(candidate.timer.startedAt))) {
          const startedAt = Number(candidate.timer.startedAt);
          if (startedAt > 0 && startedAt <= Date.now()) clean.timer = { running: true, startedAt };
        }
        return clean;
      }

      function loadState() {
        try {
          const raw = storage.getItem(STORAGE_KEY);
          return raw ? normalizeState(JSON.parse(raw)) : createEmptyState();
        } catch (error) {
          console.warn("Could not read saved tracker data; starting fresh.", error);
          return createEmptyState();
        }
      }

      function saveState() {
        try {
          storage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          console.error("Could not save tracker data.", error);
          announce("Your browser blocked local storage; changes may not persist.");
        }
      }

      function ensureDay(key) {
        if (!state.days[key]) state.days[key] = { studiedSeconds: 0, tasks: [] };
        return state.days[key];
      }

      function pendingSecondsForDay(key, now = Date.now()) {
        if (!state.timer.running || !state.timer.startedAt) return 0;
        let cursor = state.timer.startedAt;
        let pending = 0;
        while (cursor < now) {
          const end = Math.min(startOfNextDay(cursor), now);
          if (dateKeyFromDate(new Date(cursor)) === key) pending += Math.max(0, end - cursor) / 1000;
          cursor = end;
        }
        return Math.floor(pending);
      }

      function commitElapsed(startedAt, endedAt) {
        let cursor = startedAt;
        while (cursor < endedAt) {
          const end = Math.min(startOfNextDay(cursor), endedAt);
          const seconds = Math.max(0, Math.floor((end - cursor) / 1000));
          if (seconds > 0) ensureDay(dateKeyFromDate(new Date(cursor))).studiedSeconds += seconds;
          cursor = end;
        }
      }

      function totalSecondsForDay(key) {
        return ensureDay(key).studiedSeconds + pendingSecondsForDay(key);
      }

      function makeId() {
        return typeof crypto.randomUUID === "function"
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function addTask(text) {
        const trimmed = text.trim().slice(0, 240);
        if (!trimmed) return false;
        ensureDay(todayKey()).tasks.push({
          id: makeId(),
          text: trimmed,
          done: false,
          createdAt: Date.now()
        });
        saveState();
        render();
        announce("Task added.");
        return true;
      }

      function toggleTask(id) {
        const task = ensureDay(todayKey()).tasks.find(item => item.id === id);
        if (!task) return;
        task.done = !task.done;
        saveState();
        render();
      }

      function deleteTask(id) {
        const day = ensureDay(todayKey());
        day.tasks = day.tasks.filter(item => item.id !== id);
        saveState();
        render();
        announce("Task deleted.");
      }

      function startTimer() {
        if (state.timer.running) return;
        state.timer = { running: true, startedAt: Date.now() };
        saveState();
        render();
        announce("Study timer started.");
      }

      function stopTimer() {
        if (!state.timer.running || !state.timer.startedAt) return;
        commitElapsed(state.timer.startedAt, Date.now());
        state.timer = { running: false, startedAt: null };
        saveState();
        render();
        announce("Study timer stopped and saved.");
      }

      function setGoal(rawValue) {
        const goal = Number(rawValue);
        if (!Number.isFinite(goal)) return;
        state.goalHours = Math.min(24, Math.max(0.25, Math.round(goal * 4) / 4));
        saveState();
        render();
        announce(`Daily goal set to ${state.goalHours} hours.`);
      }

      function announce(message) {
        const liveRegion = document.getElementById("live-status");
        if (!liveRegion) return;
        liveRegion.textContent = "";
        requestAnimationFrame(() => { liveRegion.textContent = message; });
      }

      function renderTask(task) {
        const row = document.createElement("div");
        row.className = `task${task.done ? " done" : ""}`;

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = `check${task.done ? " checked" : ""}`;
        toggle.setAttribute("aria-label", task.done ? `Mark ${task.text} incomplete` : `Mark ${task.text} complete`);
        toggle.setAttribute("aria-pressed", String(task.done));
        toggle.dataset.action = "toggle-task";
        toggle.dataset.id = task.id;
        toggle.innerHTML = '<svg aria-hidden="true" viewBox="0 0 16 16" fill="none"><path d="M3 8.2 6.4 11.5 13 4.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        const text = document.createElement("div");
        text.className = "task-text";
        text.textContent = task.text;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "task-del";
        remove.dataset.action = "delete-task";
        remove.dataset.id = task.id;
        remove.setAttribute("aria-label", `Delete ${task.text}`);
        remove.textContent = "×";

        row.append(toggle, text, remove);
        return row;
      }

      function renderHistory() {
        const history = document.createElement("div");
        history.className = "history";
        const today = todayKey();
        const entries = Object.entries(state.days)
          .filter(([key, day]) => key !== today && (day.studiedSeconds > 0 || day.tasks.length > 0))
          .sort(([a], [b]) => b.localeCompare(a))
          .slice(0, MAX_HISTORY_ROWS);

        if (!entries.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Past study sessions will appear here.";
          history.append(empty);
          return history;
        }

        for (const [key, day] of entries) {
          const row = document.createElement("div");
          row.className = "history-row";
          const date = document.createElement("span");
          date.className = "h-date";
          date.textContent = formatDate(key, { month: "short", day: "numeric", year: "numeric" });
          const hours = document.createElement("span");
          hours.className = "h-hrs";
          hours.textContent = formatDuration(day.studiedSeconds);
          row.append(date, hours);
          history.append(row);
        }
        return history;
      }

      function render() {
        const today = todayKey();
        renderedDayKey = today;
        const day = ensureDay(today);
        const totalSeconds = totalSecondsForDay(today);
        const goalSeconds = state.goalHours * 3600;
        const progress = Math.min(1, totalSeconds / goalSeconds);
        const dashOffset = CIRCLE_CIRCUMFERENCE * (1 - progress);
        const activeElapsed = state.timer.running ? Math.floor((Date.now() - state.timer.startedAt) / 1000) : 0;

        app.innerHTML = `
          <header>
            <div class="eyebrow">Personal ledger</div>
            <h1>Daily focus</h1>
            <div class="date">${formatDate(today)}</div>
          </header>

          <section class="dial-card" aria-labelledby="study-heading">
            <div class="dial" role="img" aria-label="${Math.round(progress * 100)} percent of daily study goal completed">
              <svg viewBox="0 0 108 108" aria-hidden="true">
                <circle class="dial-track" cx="54" cy="54" r="${CIRCLE_RADIUS}"></circle>
                <circle class="dial-progress" cx="54" cy="54" r="${CIRCLE_RADIUS}"
                  stroke-dasharray="${CIRCLE_CIRCUMFERENCE.toFixed(3)}"
                  stroke-dashoffset="${dashOffset.toFixed(3)}"></circle>
              </svg>
              <div class="dial-center">
                <div class="dial-hours">${formatDuration(totalSeconds)}</div>
                <div class="dial-goal">of ${state.goalHours}h</div>
              </div>
            </div>
            <div class="timer-controls">
              <div id="study-heading" class="timer-status${state.timer.running ? " running" : ""}">
                ${state.timer.running ? `studying · ${formatDuration(activeElapsed, true)}` : "Ready for a focused session"}
              </div>
              <div class="btn-row">
                <button class="btn-primary" type="button" data-action="start-timer" ${state.timer.running ? "disabled" : ""}>Start studying</button>
                <button class="btn-stop" type="button" data-action="stop-timer" ${state.timer.running ? "" : "disabled"}>Stop</button>
              </div>
              <div class="goal-edit">
                <label for="goal-hours">Daily goal</label>
                <input id="goal-hours" type="number" inputmode="decimal" min="0.25" max="24" step="0.25" value="${state.goalHours}" aria-label="Daily study goal in hours">
                <span aria-hidden="true">hours</span>
              </div>
            </div>
          </section>

          <section class="section" aria-labelledby="tasks-heading">
            <div class="section-title">
              <span id="tasks-heading">Today's tasks</span>
              <span>${day.tasks.filter(task => task.done).length}/${day.tasks.length} done</span>
            </div>
            <div id="task-list" class="task-list"></div>
            <form id="add-task-form" class="add-row">
              <label class="sr-only" for="task-input">New task</label>
              <input id="task-input" maxlength="240" autocomplete="off" placeholder="Add a task…">
              <button class="btn-ghost" type="submit">Add</button>
            </form>
          </section>

          <section class="section" aria-labelledby="history-heading">
            <div class="section-title"><span id="history-heading">Study history</span></div>
            <div id="history-slot"></div>
          </section>

          <p class="privacy-note">Saved only in this browser. No account, server, or tracking.</p>
          <div id="live-status" class="sr-only" aria-live="polite"></div>
        `;

        const taskList = document.getElementById("task-list");
        if (day.tasks.length) {
          day.tasks.forEach(task => taskList.append(renderTask(task)));
        } else {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "A clear page. Add your first task.";
          taskList.append(empty);
        }

        document.getElementById("history-slot").append(renderHistory());
        bindEvents();
        syncTicker();
      }

      function bindEvents() {
        document.getElementById("add-task-form").addEventListener("submit", event => {
          event.preventDefault();
          const input = document.getElementById("task-input");
          if (addTask(input.value)) input.value = "";
        });
        document.getElementById("goal-hours").addEventListener("change", event => setGoal(event.target.value));
      }

      function handleClick(event) {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        if (action === "start-timer") startTimer();
        if (action === "stop-timer") stopTimer();
        if (action === "toggle-task") toggleTask(target.dataset.id);
        if (action === "delete-task") deleteTask(target.dataset.id);
      }

      function updateTimerUI() {
        if (!state.timer.running) return;
        const currentDay = todayKey();
        if (currentDay !== renderedDayKey) {
          const now = Date.now();
          commitElapsed(state.timer.startedAt, now);
          state.timer.startedAt = now;
          saveState();
          render();
          return;
        }

        const totalSeconds = totalSecondsForDay(currentDay);
        const progress = Math.min(1, totalSeconds / (state.goalHours * 3600));
        const activeElapsed = Math.floor((Date.now() - state.timer.startedAt) / 1000);
        const status = document.querySelector(".timer-status");
        const hours = document.querySelector(".dial-hours");
        const circle = document.querySelector(".dial-progress");
        const dial = document.querySelector(".dial");
        if (status) status.textContent = `studying · ${formatDuration(activeElapsed, true)}`;
        if (hours) hours.textContent = formatDuration(totalSeconds);
        if (circle) circle.setAttribute("stroke-dashoffset", (CIRCLE_CIRCUMFERENCE * (1 - progress)).toFixed(3));
        if (dial) dial.setAttribute("aria-label", `${Math.round(progress * 100)} percent of daily study goal completed`);
      }

      function syncTicker() {
        if (tickHandle) clearInterval(tickHandle);
        tickHandle = null;
        if (state.timer.running) tickHandle = setInterval(updateTimerUI, 1000);
      }

      app.addEventListener("click", handleClick);

      try {
        render();
      } catch (error) {
        console.error(error);
        app.innerHTML = '<div class="fatal"><strong>The tracker could not start.</strong>Open the browser console for details, or clear this site\'s local storage and reload.</div>';
      }
    })();
  </script>
</body>
</html>
